<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Night wallpaper: a thin arc of teal and white light bending around a dark mass, like a gravitational lens, on a near-black starfield">
