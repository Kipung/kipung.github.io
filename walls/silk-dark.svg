    <path d="M-100 348 C 300 258 540 508 860 398 S 1280 198 1580 278" fill="none" stroke="#c9c9d6" stroke-width="8" stroke-linecap="round" opacity=".4"/>
    <path d="M-140 828 C 320 708 580 888 920 728 S 1330 508 1600 588" fill="none" stroke="#8c8c9c" stroke-width="12" stroke-linecap="round" opacity=".3"/>
