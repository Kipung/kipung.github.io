<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Soft silver silk folds over cream">
  <defs>
    <linearGradient id="silkA" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#efe9de" stop-opacity="0"/>
      <stop offset=".25" stop-color="#d9d2c6"/>
      <stop offset=".5" stop-color="#c3bcb0"/>
      <stop offset=".75" stop-color="#d6cfc3" stop-opacity=".8"/>
      <stop offset="1" stop-color="#fff4e6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="silkB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3ede3" stop-opacity="0"/>
      <stop offset=".3" stop-color="#cfc8bc"/>
      <stop offset=".55" stop-color="#b5aea2"/>
      <stop offset=".8" stop-color="#ccc5b9" stop-opacity=".7"/>
      <stop offset="1" stop-color="#fff4e6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="silkC" x1="0" y1=".2" x2="1" y2=".8">
      <stop offset="0" stop-color="#e9e2d6" stop-opacity="0"/>
      <stop offset=".35" stop-color="#bdb6aa" stop-opacity=".7"/>
      <stop offset=".6" stop-color="#a8a196" stop-opacity=".55"/>
      <stop offset=".85" stop-color="#cfc8bc" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff4e6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sheen" cx=".38" cy=".28" r=".75">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".65"/>
      <stop offset=".5" stop-color="#fdf3e4" stop-opacity=".3"/>
      <stop offset="1" stop-color="#fff4e6" stop-opacity="0"/>
    </radialGradient>
    <filter id="silk" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.0065" numOctaves="3" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="85" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="silk2" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.005 0.0035" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="60" xChannelSelector="G" yChannelSelector="R"/>
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="spec" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.005 0.004" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="48" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#fff4e6"/>
  <rect width="1440" height="900" fill="url(#sheen)"/>
  <g filter="url(#silk)">
    <path d="M-160 660 C 240 520 460 800 780 620 S 1250 320 1620 460" fill="none" stroke="url(#silkA)" stroke-width="340" stroke-linecap="round" opacity=".9"/>
    <path d="M-160 280 C 300 180 560 460 880 360 S 1300 140 1620 240" fill="none" stroke="url(#silkB)" stroke-width="300" stroke-linecap="round" opacity=".75"/>
